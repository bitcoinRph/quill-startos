[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quill-server"
version = "0.1.3"
description = "Quill server: self-hosted meeting recorder, transcriber and MCP endpoint"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.32",
  "sse-starlette==3.5.1",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "itsdangerous==2.2.0",
  "sherpa-onnx==2.0.0",
  "numpy==2.5.4",
  "soundfile==0.14.0",
  "mcp==2.3.0",
  "playwright==1.64.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
include = ["quill_server*"]

[tool.setuptools.package-data]
quill_server = ["bot/page/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["models: needs the real Parakeet and Silero models (QUILL_MODELS_DIR)"]
filterwarnings = ["ignore::DeprecationWarning"]
